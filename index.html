<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airdown — trip HQ for crews who leave pavement</title>
  <meta name="description" content="Build a trip, keep the days in HQ, hand off a GPX. Not a campsite finder." />
  <meta name="theme-color" content="#f3ead9" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dust-100: #f3ead9;
      --dust-50: #faf6ee;
      --basalt: #211a13;
      --stone: #5c5145;
      --clay: #b4532c;
      --clay-dark: #8f3f22;
      --rust: #7c391f;
      --line: #e0d3bc;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--dust-100);
      color: var(--basalt);
      line-height: 1.5;
    }
    .wrap {
      width: min(100% - 2.5rem, 52.5rem);
      margin: 0 auto;
      padding: 1.75rem 0 4rem;
    }
    .mark {
      margin: 0 0 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--stone);
    }
    h1 {
      font-family: Anton, Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(2rem, 6.5vw, 3.35rem);
      line-height: 1.02;
      letter-spacing: 0.01em;
      text-wrap: balance;
      margin: 0 0 1.15rem;
      color: var(--rust);
    }
    .waitlist {
      display: grid;
      gap: 0.65rem;
      margin: 0;
    }
    label.sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    input[type="email"] {
      width: 100%;
      min-height: 48px;
      padding: 0.7rem 0.95rem;
      border-radius: 12px;
      border: 1px solid #cbbba3;
      background: var(--dust-50);
      color: var(--basalt);
      font: inherit;
      font-size: 1rem;
    }
    input[type="email"]::placeholder { color: var(--stone); opacity: 1; }
    input[type="email"]:focus {
      outline: 2px solid var(--basalt);
      outline-offset: 2px;
      border-color: var(--basalt);
    }
    button {
      min-height: 48px;
      padding: 0.75rem 1.1rem;
      border: 0;
      border-radius: 999px;
      background: var(--clay);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid var(--basalt);
      outline-offset: 3px;
    }
    @media (hover: hover) {
      button:hover { background: var(--clay-dark); }
    }
    button:active { background: var(--clay-dark); }
    .what {
      margin: 0.85rem 0 0;
      color: var(--stone);
      font-size: 0.95rem;
    }
    .shots {
      display: grid;
      gap: 1.75rem;
      margin: 2.25rem 0 0;
    }
    figure { margin: 0; }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--dust-50);
    }
    figcaption {
      margin: 0.45rem 0 0;
      color: var(--stone);
      font-size: 0.92rem;
    }
    .note {
      margin: 2.25rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--stone);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="mark">Airdown</p>
    <h1>The trip HQ for crews who leave pavement.</h1>

    <form class="waitlist" action="mailto:hello@airdown.app" method="post" enctype="text/plain">
      <label class="sr-only" for="email">Email for the waitlist</label>
      <input id="email" name="email" type="email" required autocomplete="email" inputmode="email" placeholder="you@example.com" />
      <button type="submit">Join the waitlist</button>
    </form>
    <p class="what">Build → HQ → GPX · not a campsite finder.</p>

    <div class="shots">
      <figure>
        <img src="shots/01-day-cards.png" width="414" height="276" alt="Day 1 and day 2 cards, each with the kilometres in monospace." />
        <figcaption>Day 1 and day 2 cards, kilometres in mono.</figcaption>
      </figure>
      <figure>
        <img src="shots/02-sticky-gpx.png" width="780" height="520" alt="Trip HQ corridor with the Download GPX for onX bar pinned at the bottom." />
        <figcaption>Trip HQ corridor, with the GPX bar pinned at the bottom.</figcaption>
      </figure>
      <figure>
        <img src="shots/03-osm-day-highlight.png" width="528" height="352" alt="OpenStreetMap corridor with the route, pins, and day 3 highlighted." />
        <figcaption>OpenStreetMap corridor with day 3 highlighted.</figcaption>
      </figure>
    </div>

    <p class="note">Public story page. The waitlist address hello@airdown.app is a placeholder.</p>
  </main>
</body>
</html>
